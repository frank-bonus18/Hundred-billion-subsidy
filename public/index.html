<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0058A8">
<title>百亿补贴 · API 路由中心</title>
<style>
/* 1. 亮色令牌 */
:root{
  --primary:#0058A8; --on-primary:#FFFFFF;
  --primary-container:#D3E3FF; --on-primary-container:#001A34;
  --secondary:#425F80; --on-secondary:#FFFFFF;
  --secondary-container:#D7E3FB; --on-secondary-container:#001C36;
  --tertiary:#59588B; --on-tertiary:#FFFFFF;
  --tertiary-container:#E2E0FF; --on-tertiary-container:#161544;
  --error:#B3261E; --on-error:#FFFFFF;
  --error-container:#F9DEDC; --on-error-container:#410E0B;
  --background:#FAF9FD; --on-background:#191C20;
  --surface:#FAF9FD; --on-surface:#191C20;
  --surface-variant:#DAE2ED; --on-surface-variant:#42474E;
  --surface-container-lowest:#FFFFFF; --surface-container-low:#F4F3F8;
  --surface-container:#EEEDF2; --surface-container-high:#E8E7EC;
  --surface-container-highest:#E2E2E6;
  --surface-dim:#DAD9DE; --surface-bright:#FAF9FD; --surface-tint:#0058A8;
  --outline:#707884; --outline-variant:#C2C7CF;
  --inverse-surface:#2E3135; --inverse-on-surface:#F0F0F6;
  --inverse-primary:#A3C8FF; --scrim:#000000; --scrim-color:rgba(0,0,0,.32);
  --success:#2E7D46; --on-success:#FFFFFF;
  --radius-xs:8px; --radius-sm:12px; --radius-md:16px; --radius-lg:28px; --radius-full:999px;
  --ripple-opacity:.24; --state-hover:.08; --state-focus:.12; --state-pressed:.16;
  --disabled-opacity:.38; --disabled-container:.12;
  --shadow-1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --shadow-2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
  --shadow-3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.30);
  --duration-short:150ms; --duration-medium:250ms; --duration-long:400ms;
  --easing-standard:cubic-bezier(.2,0,0,1); --easing-emphasized:cubic-bezier(.2,0,0,1);
  --font:Roboto,"Roboto Flex",system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
}
/* 2. 暗色令牌（完整镜像） */
[data-theme="dark"]{
  --primary:#A3C8FF; --on-primary:#002F59;
  --primary-container:#00437F; --on-primary-container:#D3E3FF;
  --secondary:#BBC7E0; --on-secondary:#0A3150;
  --secondary-container:#2A4768; --on-secondary-container:#D7E3FB;
  --tertiary:#C5C1FF; --on-tertiary:#2C2B5C;
  --tertiary-container:#424173; --on-tertiary-container:#E2E0FF;
  --error:#F2B8B5; --on-error:#601410;
  --error-container:#8C1D18; --on-error-container:#F9DEDC;
  --background:#111418; --on-background:#E0E2E8;
  --surface:#111418; --on-surface:#E0E2E8;
  --surface-variant:#404854; --on-surface-variant:#C2C7CF;
  --surface-container-lowest:#0C0E12; --surface-container-low:#191C20;
  --surface-container:#1D2024; --surface-container-high:#282A2F;
  --surface-container-highest:#33353A;
  --surface-dim:#111418; --surface-bright:#37393E; --surface-tint:#A3C8FF;
  --outline:#8A929E; --outline-variant:#42474E;
  --inverse-surface:#E0E2E8; --inverse-on-surface:#2E3135;
  --inverse-primary:#0058A8; --scrim:#000000; --scrim-color:rgba(0,0,0,.55);
  --success:#9CE8AE; --on-success:#2E7D46;
}
/* 3. 重置与全局过渡 */
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
html,body{min-height:100dvh;min-height:100vh;background:var(--background)}
body{
  font-family:var(--font);color:var(--on-background);
  background:var(--background);line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  transition:background-color var(--duration-medium) var(--easing-standard),
    color var(--duration-medium) var(--easing-standard);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-xs)}
.skip-link{
  position:absolute;left:16px;top:-60px;z-index:100;
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  padding:10px 16px;border-radius:var(--radius-full);text-decoration:none;
  transition:top var(--duration-short) var(--easing-standard);
}
.skip-link:focus{top:16px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 水波纹 */
.m3-ripple-surface{position:relative;overflow:hidden;isolation:isolate}
.m3-ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  background:var(--ripple-color,currentColor);
  transform:scale(0);opacity:var(--ripple-opacity);
  animation:m3-ripple-in 520ms var(--easing-standard) forwards;
}
@keyframes m3-ripple-in{
  0%{transform:scale(0);opacity:var(--ripple-opacity)}
  70%{opacity:calc(var(--ripple-opacity) * .55)}
  100%{transform:scale(1);opacity:0}
}

/* 4. 组件 */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
  background:var(--surface-container-low);
  border-bottom:1px solid var(--outline-variant);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:var(--radius-md);
  background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;flex:none;
}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:18px;font-weight:600;letter-spacing:.2px}
.brand p{font-size:12px;color:var(--on-surface-variant)}
.topbar .spacer{flex:1}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.navlink{padding:8px 14px;border-radius:var(--radius-full);color:var(--on-surface-variant);font-size:14px;text-decoration:none}
.navlink:hover{background:color-mix(in srgb,var(--on-surface) var(--state-hover),transparent)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.plan-card{background:var(--surface-container-low);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-1)}
.plan-card h3{font-size:18px;margin-bottom:6px}
.plan-card .price{font-size:26px;font-weight:600;color:var(--primary)}
.plan-card ul{margin:12px 0 0 18px;color:var(--on-surface-variant)}
.doc-block{background:var(--surface-container-low);border-radius:var(--radius-md);padding:20px;margin-top:16px;box-shadow:var(--shadow-1)}
.doc-block pre{background:var(--surface-container);border-radius:var(--radius-sm);padding:14px;overflow-x:auto;font-size:13px}
.pill-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pill{padding:6px 14px;border-radius:var(--radius-full);background:var(--secondary-container);color:var(--on-secondary-container);font-size:13px}
@media(max-width:720px){.topnav{display:none}}

.m3-icon-btn{
  width:40px;height:40px;border-radius:var(--radius-full);
  border:none;background:transparent;color:var(--on-surface-variant);
  display:grid;place-items:center;cursor:pointer;
  transition:background-color var(--duration-short) var(--easing-standard);
}
.m3-icon-btn:hover{background:color-mix(in srgb,var(--on-surface) var(--state-hover),transparent)}
.m3-icon-btn svg{width:22px;height:22px}

.m3-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 20px;border-radius:var(--radius-full);
  border:1px solid transparent;cursor:pointer;text-decoration:none;
  font-weight:500;transition:background-color var(--duration-short) var(--easing-standard),
    box-shadow var(--duration-short) var(--easing-standard);
}
.m3-btn svg{width:18px;height:18px}
.m3-text{background:transparent;color:var(--primary)}
.m3-text:hover{background:color-mix(in srgb,var(--primary) var(--state-hover),transparent)}
#authArea{display:inline-flex;align-items:center;gap:8px}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--radius-full);
  background:var(--secondary-container);color:var(--on-secondary-container);font-size:14px;font-weight:500}
.m3-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.m3-filled{background:var(--primary);color:var(--on-primary)}
.m3-outline{background:transparent;border-color:var(--outline);color:var(--primary)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 120px}

.hero{
  background:var(--primary-container);color:var(--on-primary-container);
  border-radius:var(--radius-lg);padding:28px;display:flex;flex-wrap:wrap;
  gap:20px;align-items:center;justify-content:space-between;
}
.hero h2{font-size:24px;font-weight:600;margin-bottom:6px}
.hero p{max-width:520px;color:var(--on-primary-container);opacity:.85}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.stat-pill{
  background:var(--surface-container-lowest);border-radius:var(--radius-md);
  padding:14px 18px;min-width:110px;box-shadow:var(--shadow-1);
}
.stat-pill .num{font-size:22px;font-weight:700;color:var(--on-surface)}
.stat-pill .lbl{font-size:12px;color:var(--on-surface-variant)}

.filters{margin:24px 0 16px;display:flex;flex-direction:column;gap:14px}
.searchbar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-container-high);border-radius:var(--radius-full);
  padding:0 16px;height:48px;
}
.searchbar svg{width:20px;height:20px;color:var(--on-surface-variant);flex:none}
.searchbar input{
  flex:1;border:none;background:transparent;outline:none;height:100%;
  color:var(--on-surface);
}
.searchbar input::placeholder{color:var(--on-surface-variant)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m3-chip{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;
  border-radius:var(--radius-xs);border:1px solid var(--outline-variant);
  background:transparent;color:var(--on-surface-variant);cursor:pointer;
  transition:background-color var(--duration-short) var(--easing-standard);
}
.m3-chip.selected{
  background:var(--secondary-container);color:var(--on-secondary-container);
  border-color:transparent;
}
.m3-chip--static{cursor:default;pointer-events:none}
.m3-select{
  height:36px;border-radius:var(--radius-xs);border:1px solid var(--outline-variant);
  background:var(--surface-container-low);color:var(--on-surface);padding:0 12px;outline:none;
}

.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:8px}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1020px){.grid{grid-template-columns:repeat(3,1fr)}}

.m3-card{
  background:var(--surface-container-low);border-radius:var(--radius-md);
  padding:18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow-1);border:1px solid transparent;
  transition:background-color var(--duration-medium) var(--easing-standard),
    box-shadow var(--duration-medium) var(--easing-standard);
}
.card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.method{
  font-size:12px;font-weight:700;letter-spacing:.5px;
  padding:4px 10px;border-radius:var(--radius-xs);min-width:58px;text-align:center;
}
.method-GET{background:var(--primary-container);color:var(--on-primary-container)}
.method-POST{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.method-PUT{background:var(--secondary-container);color:var(--on-secondary-container)}
.method-PATCH{background:var(--surface-container-high);color:var(--on-surface)}
.method-DELETE{background:var(--error-container);color:var(--on-error-container)}
.path{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:var(--on-surface);word-break:break-all;
}
.card-name{font-size:16px;font-weight:600}
.card-badge{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0 2px;font-size:12px}
.card-badge .vendor{font-weight:600;color:var(--on-surface-variant)}
.card-badge .model-id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--primary)}
.card-desc{font-size:13px;color:var(--on-surface-variant);min-height:38px}
.card-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--on-surface-variant)}
.meta-item{display:inline-flex;align-items:center;gap:5px}
.meta-item svg{width:15px;height:15px}
.status-dot{width:8px;height:8px;border-radius:var(--radius-full);display:inline-block}
.status-online{background:var(--success)}
.status-offline{background:var(--outline)}
.status-deprecated{background:var(--error)}
.tag{
  font-size:11px;padding:3px 8px;border-radius:var(--radius-full);
  background:var(--surface-container-high);color:var(--on-surface-variant);
}
.card-actions{display:flex;gap:8px;margin-top:auto}
.card-actions .m3-text{height:36px;padding:0 12px;font-size:13px}

.empty{
  text-align:center;padding:60px 20px;color:var(--on-surface-variant);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty svg{width:48px;height:48px;opacity:.5}

/* 对话框与遮罩 */
#scrim{
  position:fixed;inset:0;background:var(--scrim-color);z-index:40;
  opacity:0;pointer-events:none;transition:opacity var(--duration-medium) var(--easing-standard);
}
#scrim.show{opacity:1;pointer-events:auto}
.m3-dialog{
  position:fixed;z-index:50;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.96);
  width:min(560px,calc(100vw - 32px));max-height:82dvh;max-height:82vh;
  overflow:auto;background:var(--surface-container-high);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-3);
  padding:24px;display:flex;flex-direction:column;gap:16px;
  opacity:0;pointer-events:none;transition:opacity var(--duration-medium) var(--easing-standard),
    transform var(--duration-medium) var(--easing-emphasized);
}
.m3-dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog-head{display:flex;align-items:flex-start;gap:12px}
.dialog-head h3{font-size:20px;font-weight:600;flex:1}
.dialog-body{display:flex;flex-direction:column;gap:14px}
.detail-row{display:flex;gap:10px;font-size:13px}
.detail-row .k{width:96px;flex:none;color:var(--on-surface-variant)}
.detail-row .v{flex:1;word-break:break-all}
.detail-row .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dialog-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* Snackbar */
#snackbar{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  padding:12px 18px;border-radius:var(--radius-xs);box-shadow:var(--shadow-2);
  opacity:0;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);
  transition:opacity var(--duration-medium) var(--easing-standard),
    transform var(--duration-medium) var(--easing-standard);
}
#snackbar.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{
  max-width:1080px;margin:0 auto;padding:24px 20px 40px;
  color:var(--on-surface-variant);font-size:12px;text-align:center;
}

@media (min-width:900px){
  .wrap{padding-top:32px}
  .hero{padding:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳转到主要内容</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 7v10l8 5 8-5V7l-8-5zm0 2.3L17.8 8 12 11.7 6.2 8 12 4.3zM6 9.7l5 3.1v6.2l-5-3.1V9.7zm7 9.3v-6.2l5-3.1v6.2l-5 3.1z"/></svg>
    </span>
    <div>
      <h1>百亿补贴</h1>
      <p>API 路由中心</p>
    </div>
  </div>
  <nav class="topnav" aria-label="主导航">
    <a class="navlink" href="/index.html">模型目录</a>
    <a class="navlink" href="#plans">套餐充值</a>
    <a class="navlink" href="#docs">接入文档</a>
    <a class="navlink" href="/console.html">控制台</a>
  </nav>
  <div class="spacer"></div>
  <button class="m3-icon-btn m3-ripple-surface" id="themeToggle" type="button" aria-label="切换深色或浅色模式">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
  <div id="authArea"></div>
</header>

<main id="main" class="wrap">
  <section class="hero" aria-labelledby="heroTitle">
    <div>
      <h2 id="heroTitle">模型目录</h2>
      <p>统一查看「百亿补贴」路由中心接入的全部 AI 模型，按渠道分组、请求方法与关键词检索，点击卡片查看接入路径、定价与上下文规格。</p>
    </div>
    <div class="hero-stats" id="heroStats" aria-label="模型概览统计"></div>
  </section>

  <section class="filters" aria-label="筛选条件">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="searchInput" type="search" placeholder="搜索模型、厂商、路径或标签" aria-label="搜索模型">
    </div>
    <div class="filter-row" id="methodChips" role="group" aria-label="按请求方法筛选"></div>
    <div class="filter-row">
      <select class="m3-select" id="groupSelect" aria-label="按分组筛选"></select>
      <select class="m3-select" id="statusSelect" aria-label="按状态筛选">
        <option value="ALL">全部状态</option>
        <option value="online">在线</option>
        <option value="offline">离线</option>
        <option value="deprecated">已废弃</option>
      </select>
    </div>
  </section>

  <section class="grid" id="routeList" aria-label="模型列表"></section>

  <section class="doc-block" id="plans" aria-labelledby="plansTitle" style="margin-top:28px">
    <h2 id="plansTitle" style="font-size:22px;font-weight:600">套餐与充值</h2>
    <p style="color:var(--on-surface-variant);margin-top:6px">下单后联系客服开通，额度按 token 计费扣减；充值多充多送。</p>
    <div class="plan-grid" id="planGrid"></div>
    <div class="pill-row" id="rechargeRow"></div>
  </section>

  <section class="doc-block" id="docs" aria-labelledby="docsTitle" style="margin-top:20px">
    <h2 id="docsTitle" style="font-size:22px;font-weight:600">接入文档</h2>
    <p style="color:var(--on-surface-variant);margin-top:6px">兼容 OpenAI 接口格式，将 Base URL 指向本站，使用控制台生成的 API Key 调用。</p>
    <div class="pill-row" id="pricePills"></div>
    <pre id="docsSample" style="margin-top:12px"></pre>
  </section>
</main>

<footer>百亿补贴 · API 路由中心 — 模型数据由后端服务统一管理</footer>

<div id="scrim" class="m3-scrim" aria-hidden="true"></div>
<div class="m3-dialog" id="detailDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
  <div class="dialog-head">
    <h3 id="dialogTitle">模型详情</h3>
    <button class="m3-icon-btn m3-ripple-surface" id="dialogClose" type="button" aria-label="关闭详情">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div class="dialog-body" id="dialogBody"></div>
  <div class="dialog-foot">
    <button class="m3-btn m3-outline m3-ripple-surface" id="dialogCopy" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 14H8V7h11v12z"/></svg>
      复制完整地址
    </button>
  </div>
</div>

<div id="snackbar" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- 状态 ---------- */
var state = { q:'', method:'ALL', group:'ALL', status:'ALL', routes:[], groups:[] };
var lastFocused = null, openLayer = null, currentRoute = null;

/* ---------- 工具 ---------- */
function $(sel){ return document.querySelector(sel); }
function el(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(n){ return Number(n || 0).toLocaleString('zh-CN'); }
function statusMeta(s){
  return { online:['在线','status-online'], offline:['离线','status-offline'], deprecated:['已废弃','status-deprecated'] }[s] || [s,'status-offline'];
}
function fmtCtx(n){ n = Number(n || 0); if(!n) return '—'; return n >= 1000 ? (n/1000) + 'k 上下文' : n + ' token'; }
function fmtPrice(n){ n = Number(n || 0); return n > 0 ? '¥' + n + ' / 百万 token' : '按次计费'; }

/* ---------- 水波纹（document 级委托） ---------- */
var RIPPLE_SELECTOR = [
  '.m3-btn','.m3-icon-btn','.m3-chip','.m3-card','.m3-searchbar','.m3-select'
].join(',');
document.addEventListener('pointerdown', function(ev){
  var host = ev.target.closest ? ev.target.closest(RIPPLE_SELECTOR) : null;
  if(!host || host.disabled) return;
  var rect = host.getBoundingClientRect();
  var d = Math.max(rect.width, rect.height);
  var rip = document.createElement('span');
  rip.className = 'm3-ripple';
  rip.style.width = rip.style.height = d + 'px';
  rip.style.left = (ev.clientX - rect.left - d/2) + 'px';
  rip.style.top = (ev.clientY - rect.top - d/2) + 'px';
  host.appendChild(rip);
  setTimeout(function(){ rip.remove(); }, 540);
});

/* ---------- 主题切换（不持久化） ---------- */
el('themeToggle').addEventListener('click', function(){
  var root = document.documentElement;
  var dark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});

/* ---------- Snackbar ---------- */
var snackTimer = null;
function snackbar(msg){
  var bar = el('snackbar');
  bar.textContent = msg;
  bar.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(function(){ bar.classList.remove('show'); }, 2800);
}

/* ---------- 登录态 ---------- */
var TOKEN_KEY = 'by_token';
var me = { token: (function(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } })(), username:'', displayName:'', role:'', email:'' };

async function loadMe(){
  if(!me.token){ renderAuth(); return; }
  try{
    var res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + me.token } });
    if(!res.ok) throw new Error('unauth');
    var data = await res.json();
    me.username = data.username;
    me.displayName = data.displayName || data.username;
    me.role = data.role || 'member';
    me.email = data.email || '';
  }catch(e){
    try{ localStorage.removeItem(TOKEN_KEY); }catch(_){}
    me.token = '';
  }
  renderAuth();
}
function renderAuth(){
  var box = el('authArea');
  if(!me.token){
    box.innerHTML = '<a class="m3-btn m3-text m3-ripple-surface" href="/admin.html">登录 / 注册</a>';
    return;
  }
  var consoleLink = '<a class="m3-btn m3-text" href="/console.html">控制台</a>';
  var adminLink = me.role === 'admin' ? '<a class="m3-btn m3-text" href="/admin.html">管理后台</a>' : '';
  box.innerHTML = '<span class="user-chip">' + escapeHtml(me.displayName) + '</span>' + consoleLink + adminLink +
    '<button class="m3-btn m3-text m3-ripple-surface" type="button" id="logoutBtn">退出</button>';
  var lb = el('logoutBtn');
  if(lb) lb.addEventListener('click', logout);
}
async function logout(){
  try{ await fetch('/api/logout', { method:'POST', headers: { 'Authorization': 'Bearer ' + me.token } }); }catch(e){}
  try{ localStorage.removeItem(TOKEN_KEY); }catch(_){}
  me.token = '';
  renderAuth();
  snackbar('已退出登录');
}

/* ---------- 数据加载 ---------- */
async function loadStats(){
  try{
    var res = await fetch('/api/stats');
    var stats = await res.json();
    el('heroStats').innerHTML =
      '<div class="stat-pill"><div class="num">'+fmtNum(stats.total)+'</div><div class="lbl">模型总数</div></div>' +
      '<div class="stat-pill"><div class="num">'+fmtNum(stats.online)+'</div><div class="lbl">在线模型</div></div>' +
      '<div class="stat-pill"><div class="num">'+fmtNum(stats.vendorCount || 0)+'</div><div class="lbl">上游厂商</div></div>';
  }catch(e){ /* 后端未启动时保持空态 */ }
}

async function loadPlans(){
  try{
    var res = await fetch('/api/plans');
    var d = await res.json();
    var plans = d.plans || {};
    var grid = el('planGrid');
    grid.innerHTML = Object.keys(plans).map(function(k){
      var p = plans[k];
      return '<div class="plan-card"><h3>'+escapeHtml(p.name || k)+'</h3>' +
        '<div class="price">¥'+escapeHtml(p.price)+'</div>' +
        '<ul><li>额度 '+escapeHtml(p.quota)+' 元</li>'+(p.desc?'<li>'+escapeHtml(p.desc)+'</li>':'')+'</ul>' +
        '<a class="m3-btn m3-filled m3-ripple-surface" style="margin-top:14px" href="/console.html">前往下单</a></div>';
    }).join('');
    var rc = d.recharge || {};
    el('rechargeRow').innerHTML = (rc.presets || []).map(function(x){
      return '<span class="pill">充 ¥'+escapeHtml(x.charge)+' 得 ¥'+escapeHtml(x.give)+'</span>';
    }).join('') + (rc.note ? '<span class="pill">'+escapeHtml(rc.note)+'</span>' : '');
    var pr = d.pricing || {};
    el('pricePills').innerHTML =
      '<span class="pill">输入 ¥'+escapeHtml(pr.priceIn)+' / 百万 token</span>' +
      '<span class="pill">缓存命中 ¥'+escapeHtml(pr.priceCache)+' / 百万 token</span>' +
      '<span class="pill">输出 ¥'+escapeHtml(pr.priceOut)+' / 百万 token</span>' +
      '<span class="pill">当前 '+(pr.peakNow ? '高峰时段' : '低峰时段')+'</span>';
    var host = location.host;
    var model = (d.models && d.models[0] && d.models[0].id) || 'gpt-4o';
    el('docsSample').textContent = 'curl '+location.protocol+'//'+host+'/v1/chat/completions \\\n' +
      '  -H "Authorization: Bearer sk_by_***" \\\n' +
      '  -H "Content-Type: application/json" \\\n' +
      '  -d \'{"model":"'+model+'","messages":[{"role":"user","content":"你好"}]}\'';
  }catch(e){ /* 后端未启动时保持空态 */ }
}

async function loadGroups(){
  try{
    var res = await fetch('/api/groups');
    var data = await res.json();
    state.groups = data.groups || [];
  }catch(e){ state.groups = []; }
  var sel = el('groupSelect');
  sel.innerHTML = '<option value="ALL">全部分组</option>' +
    state.groups.map(function(g){ return '<option value="'+escapeHtml(g)+'">'+escapeHtml(g)+'</option>'; }).join('');
}

async function loadRoutes(){
  try{
    var params = new URLSearchParams();
    if(state.q) params.set('q', state.q);
    if(state.method !== 'ALL') params.set('method', state.method);
    if(state.group !== 'ALL') params.set('group', state.group);
    if(state.status !== 'ALL') params.set('status', state.status);
    var res = await fetch('/api/routes?' + params.toString());
    var data = await res.json();
    state.routes = data.routes || [];
  }catch(e){ state.routes = []; }
  renderList();
}

/* ---------- 方法筛选 chips ---------- */
var METHOD_ALL = ['ALL','GET','POST','PUT','PATCH','DELETE'];
function renderChips(){
  var box = el('methodChips');
  box.innerHTML = METHOD_ALL.map(function(m){
    var label = m === 'ALL' ? '全部方法' : m;
    var cls = 'm3-chip m3-ripple-surface' + (state.method === m ? ' selected' : '');
    return '<button class="'+cls+'" type="button" data-method="'+m+'">'+label+'</button>';
  }).join('');
}
document.addEventListener('click', function(ev){
  var btn = ev.target.closest('button[data-method]');
  if(!btn) return;
  state.method = btn.dataset.method;
  renderChips();
  loadRoutes();
});

/* ---------- 列表渲染 ---------- */
function renderList(){
  var box = el('routeList');
  if(!state.routes.length){
    box.innerHTML =
      '<div class="empty" style="grid-column:1/-1">' +
      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9.5 14h-2v-2h2v2zm0-4h-2V9h2v4zm4 4h-2v-2h2v2zm0-4h-2V9h2v4zm4 4h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>' +
      '<p>没有匹配的模型，试试调整关键词或筛选条件。</p></div>';
    return;
  }
  box.innerHTML = state.routes.map(function(r){
    var st = statusMeta(r.status);
    var tags = (r.tags || []).map(function(t){ return '<span class="tag">'+escapeHtml(t)+'</span>'; }).join('');
    return '<article class="m3-card m3-ripple-surface" data-id="'+r.id+'">' +
      '<div class="card-top">' +
        '<span class="method method-'+r.method+'">'+r.method+'</span>' +
        '<span class="path">'+escapeHtml(r.path)+'</span>' +
      '</div>' +
      '<div class="card-name">'+escapeHtml(r.name)+'</div>' +
      ((r.vendor || r.model) ? '<div class="card-badge">'+(r.vendor ? '<span class="vendor">'+escapeHtml(r.vendor)+'</span>' : '')+(r.model ? '<span class="model-id">'+escapeHtml(r.model)+'</span>' : '')+'</div>' : '') +
      '<p class="card-desc">'+escapeHtml(r.description || '暂无描述')+'</p>' +
      '<div class="card-meta">' +
        '<span class="meta-item"><span class="status-dot '+st[1]+'"></span>'+st[0]+'</span>' +
        '<span class="meta-item">'+escapeHtml(r.group)+'</span>' +
        '<span class="meta-item">'+fmtCtx(r.context)+'</span>' +
        '<span class="meta-item">输入 '+fmtPrice(r.priceIn)+'</span>' +
        '<span class="meta-item"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 13h2l2-6 4 12 3-9 2 3h5v2H9.6l-1.8-3.6L6 15l-1.2-3z"/></svg>'+fmtNum(r.calls)+' 次调用</span>' +
      '</div>' +
      '<div class="card-meta">'+tags+'</div>' +
      '<div class="card-actions">' +
        '<button class="m3-btn m3-text m3-ripple-surface" type="button" data-action="detail" data-id="'+r.id+'">查看详情</button>' +
        '<button class="m3-btn m3-text m3-ripple-surface" type="button" data-action="copy" data-id="'+r.id+'">复制地址</button>' +
      '</div>' +
    '</article>';
  }).join('');
}

document.addEventListener('click', function(ev){
  var btn = ev.target.closest('button[data-action]');
  if(!btn) return;
  var route = state.routes.find(function(r){ return r.id === btn.dataset.id; });
  if(!route) return;
  if(btn.dataset.action === 'detail') openDetail(route);
  else copyEndpoint(route);
});

/* ---------- 详情对话框 ---------- */
function openDetail(route){
  currentRoute = route;
  lastFocused = document.activeElement;
  var st = statusMeta(route.status);
  var tags = (route.tags || []).map(function(t){ return '<span class="tag">'+escapeHtml(t)+'</span>'; }).join('') || '—';
  el('dialogBody').innerHTML =
    '<div class="detail-row"><span class="k">模型标识</span><span class="v mono">'+escapeHtml(route.model || '—')+'</span></div>' +
    '<div class="detail-row"><span class="k">上游厂商</span><span class="v">'+escapeHtml(route.vendor || '—')+'</span></div>' +
    '<div class="detail-row"><span class="k">请求方法</span><span class="v"><span class="method method-'+route.method+'">'+route.method+'</span></span></div>' +
    '<div class="detail-row"><span class="k">接入路径</span><span class="v mono">'+escapeHtml(route.path)+'</span></div>' +
    '<div class="detail-row"><span class="k">完整地址</span><span class="v mono">'+escapeHtml(route.baseUrl)+escapeHtml(route.path)+'</span></div>' +
    '<div class="detail-row"><span class="k">渠道分组</span><span class="v">'+escapeHtml(route.group)+'</span></div>' +
    '<div class="detail-row"><span class="k">上下文长度</span><span class="v">'+fmtCtx(route.context)+'</span></div>' +
    '<div class="detail-row"><span class="k">输入单价</span><span class="v">'+fmtPrice(route.priceIn)+'</span></div>' +
    '<div class="detail-row"><span class="k">输出单价</span><span class="v">'+fmtPrice(route.priceOut)+'</span></div>' +
    '<div class="detail-row"><span class="k">版本</span><span class="v">'+escapeHtml(route.version)+'</span></div>' +
    '<div class="detail-row"><span class="k">状态</span><span class="v"><span class="status-dot '+st[1]+'"></span> '+st[0]+'</span></div>' +
    '<div class="detail-row"><span class="k">鉴权</span><span class="v">'+(route.authRequired ? '需要访问令牌' : '公开访问')+'</span></div>' +
    '<div class="detail-row"><span class="k">限流</span><span class="v">每 '+fmtNum(route.rateLimit)+' 次 / 分钟</span></div>' +
    '<div class="detail-row"><span class="k">平均延迟</span><span class="v">'+route.latency+' ms</span></div>' +
    '<div class="detail-row"><span class="k">累计调用</span><span class="v">'+fmtNum(route.calls)+' 次</span></div>' +
    '<div class="detail-row"><span class="k">标签</span><span class="v">'+tags+'</span></div>' +
    '<div class="detail-row"><span class="k">描述</span><span class="v">'+escapeHtml(route.description || '暂无描述')+'</span></div>';
  el('detailDialog').hidden = false;
  requestAnimationFrame(function(){
    el('scrim').classList.add('show');
    el('detailDialog').classList.add('show');
  });
  openLayer = el('detailDialog');
  document.body.style.overflow = 'hidden';
  el('dialogClose').focus();
}
function closeDialog(){
  if(!openLayer) return;
  openLayer.classList.remove('show');
  el('scrim').classList.remove('show');
  document.body.style.overflow = '';
  var dlg = openLayer;
  openLayer = null;
  setTimeout(function(){ dlg.hidden = true; }, 200);
  if(lastFocused) lastFocused.focus();
}
el('dialogClose').addEventListener('click', closeDialog);
el('dialogCopy').addEventListener('click', function(){ if(currentRoute) copyEndpoint(currentRoute); });
el('scrim').addEventListener('click', closeDialog);
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && openLayer) closeDialog();
});

/* ---------- 复制 ---------- */
function copyEndpoint(route){
  var text = route.baseUrl + route.path;
  function done(){ snackbar('地址已复制到剪贴板'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ snackbar('复制失败，请手动复制'); }
  ta.remove();
}

/* ---------- 筛选事件 ---------- */
var debounce = null;
el('searchInput').addEventListener('input', function(ev){
  state.q = ev.target.value.trim();
  clearTimeout(debounce);
  debounce = setTimeout(loadRoutes, 200);
});
el('groupSelect').addEventListener('change', function(ev){ state.group = ev.target.value; loadRoutes(); });
el('statusSelect').addEventListener('change', function(ev){ state.status = ev.target.value; loadRoutes(); });

/* ---------- 初始化 ---------- */
renderChips();
loadMe();
loadStats();
loadPlans();
loadGroups().then(loadRoutes);
})();
</script>
